<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lição • Católico Raiz</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body class="quiz-bg"><header class="lesson-header"><button id="exitBtn" class="icon-btn" aria-label="Sair">×</button><div class="lesson-progress"><span id="progressBar"></span></div><div class="heart-counter">❤️ <b id="hearts">5</b></div></header><main class="lesson-shell"><section id="loading" class="lesson-card center-card"><div class="mascot bounce">✠</div><h2>Preparando sua lição...</h2></section><section id="start" class="lesson-card start-card hidden"><div class="mascot start-mascot">✠</div><span class="eyebrow">LIÇÃO 1</span><h1>Fundamentos da Fé</h1><p>10 desafios rápidos. Cada acerto vale XP. Você começa com 5 corações.</p><div class="lesson-info"><span>⚡ 100 XP</span><span>❤️ 5 vidas</span><span>⏱️ 12 min</span></div><form id="startForm"><div class="input-grid"><label><span>Nome</span><input name="name" required minlength="2" placeholder="Seu nome"></label><label><span>Apelido</span><input name="nickname" required minlength="2" maxlength="50" placeholder="Nome no ranking"></label><label><span>E-mail</span><input name="email" type="email" required placeholder="voce@email.com"></label><label><span>WhatsApp</span><input name="whatsapp" inputmode="tel" placeholder="(82) 99999-9999"></label></div><label class="consent"><input type="checkbox" required><span>Concordo com o uso dos dados para operar o desafio e exibir apenas meu apelido no ranking.</span></label><p id="startError" class="error"></p><button class="game-btn primary full" type="submit">INICIAR LIÇÃO</button></form></section><section id="quiz" class="hidden"><div class="question-top"><span class="category-pill" id="category">FÉ CATÓLICA</span><span class="timer-pill" id="timer">12:00</span></div><article class="lesson-card question-card"><div class="question-count" id="questionCount">1 de 10</div><h2 id="questionText"></h2><div id="options" class="answer-grid"></div></article><div id="feedback" class="feedback-panel hidden"><div class="feedback-icon" id="feedbackIcon">✓</div><div><h3 id="feedbackTitle">Muito bem!</h3><p id="feedbackText"></p><small id="referenceText"></small></div><button id="continueBtn" class="game-btn primary">CONTINUAR</button></div><button id="checkBtn" class="game-btn disabled full" disabled>VERIFICAR</button><p id="quizError" class="error"></p></section><section id="result" class="lesson-card result-card hidden"><div class="confetti">✦ ✧ ✦</div><div class="mascot result-mascot">✠</div><span class="eyebrow">LIÇÃO CONCLUÍDA</span><h1 id="resultTitle">Mandou bem!</h1><div class="result-stats"><div><span>⚡</span><b id="xp">0</b><small>XP</small></div><div><span>🎯</span><b id="accuracy">0%</b><small>Acertos</small></div><div><span>⏱️</span><b id="timeSpent">0:00</b><small>Tempo</small></div></div><p id="resultText"></p><div class="actions vertical"><button class="game-btn primary full" id="shareBtn">COMPARTILHAR RESULTADO</button><a class="game-btn secondary full" href="/">VOLTAR PARA A TRILHA</a></div></section></main><script src="config.js"></script><script src="api.js"></script><script src="quiz.js"></script></body></html>
